<div class="form-card">
        <h2>+ Add Product Bottle / Item</h2>
        <div class="row">
          <div class="input-group" style="flex: 2;">
            <label>Product Name</label>
            <input type="text" id="cName" placeholder="e.g. Toner, Serum, Shampoo" />
          </div>
          <div class="input-group" style="flex: 1.2;">
            <label>Category</label>
            <select id="cCategory">
              <option value="Skincare">Skincare</option>
              <option value="Haircare">Haircare</option>
              <option value="Body & Bath">Body & Bath</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div class="input-group" style="flex: 1;">
            <label>Price (฿)</label>
            <input type="number" id="cPrice" placeholder="e.g. 450" min="0" />
          </div>
          <div class="input-group" style="flex: 1;">
            <label>PAO (Months)</label>
            <input type="number" id="cPaoMonths" placeholder="e.g. 6 or 12" min="1" />
          </div>
        </div>
        <div class="row">
          <div class="input-group">
            <label>Date Bought</label>
            <input type="date" id="cDateBought" />
          </div>
          <div class="input-group">
            <label>Date Opened</label>
            <input type="date" id="cDateOpened" />
          </div>
        </div>
        <button class="btn-submit" onclick="saveCareItem()">Save Bottle to Care Tracker</button>
      </div>
